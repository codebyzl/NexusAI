spring:
  application:
    name: nexus-auth-service

  datasource:
    url: "jdbc:mysql://127.0.0.1:${MYSQL_PORT:3307}/${MYSQL_DATABASE:nexusai}?serverTimezone=UTC"
    username: "${MYSQL_USER:nexusai}"
    password: "${MYSQL_PASSWORD}"

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: false
    out-of-order: false

server:
  port: 8081
  servlet:
    context-path: /api


nexus:
  security:
    jwt:
      issuer: nexus-auth-service
      access-token-ttl: 15m
      secret: "${JWT_ACCESS_TOKEN_SECRET}"
    refresh-token:
      ttl: 7d
      byte-length: 32

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true