spring:
  application:
    name: nexus-auth-service

  datasource:
    url: "jdbc:mysql://127.0.0.1:${MYSQL_PORT:3307}/${MYSQL_DATABASE:nexusai}?serverTimezone=UTC"
    username: "${MYSQL_USER:nexusai}"
    password: "${MYSQL_PASSWORD}"

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT}
      timeout: ${REDIS_TIMEOUT}

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: false
    out-of-order: false

server:
  port: 8081
  servlet:
    context-path: /api


nexus:
  security:
    jwt:
      issuer: nexus-auth-service
      access-token-ttl: 15m
      secret: "${JWT_ACCESS_TOKEN_SECRET}"

    refresh-token:
      ttl: 7d
      byte-length: 32

    login-attempt:
      max-failures: ${LOGIN_MAX_FAILURES:5}
      window: ${LOGIN_FAILURE_WINDOW:15m}
      block-duration: ${LOGIN_BLOCK_DURATION:15m}
      key-prefix: ${LOGIN_KEY_PREFIX:nexus:auth:login-attempt}
      hmac-secret: ${LOGIN_HMAC_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
